---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # Xdebug only slows the run down in CI
      XDEBUG_MODE: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The dev image runs as the host user (Dockerfile, frankenphp_dev): use the runner's ids,
      # so vendor/ and caches created in the container belong to the runner
      - name: Export runner UID and GID
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Static analysis and linters
        run: make qa
      - name: Tests
        run: make test
      # Smoke check of the production asset pipeline (same steps as the prod image)
      - name: Build assets
        run: |
          make console c='tailwind:build --minify'
          make console c='asset-map:compile'
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One "Lint" check instead of a status per linter (no statuses: write needed)
          MULTI_STATUS: false
          # v9 posts a summary comment on PRs by default (needs pull-requests: write); the Lint check is enough
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          # v9 looks for stylelint.config.mjs by default; keep the JSON config
          CSS_FILE_NAME: .stylelintrc.json
          # PRs: changed files only (fast); pushes to main and manual runs: whole repository
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}
          # Commit messages are checked by commitlint with .commitlintrc.json (Conventional Commits, CONTRIBUTING.md)
          # Not our code: vendored daisyUI build, config reference generated by FrameworkBundle
          FILTER_REGEX_EXCLUDE: (tailwind/plugins/.*|config/reference\.php)
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_PYTHON_BLACK: false
          # PHP is covered by `make qa` with the project's own config and PHP version
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
          # Prettier would rewrite recipe-generated YAML and the docs tables; yamllint and markdownlint stay on
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          # English terminology rules (textlint) do not fit the Ukrainian docs
          VALIDATE_NATURAL_LANGUAGE: false
